<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · 页面不存在</title>
<style>
  :root{ --bg:#f5f6f8; --text:#111827; --muted:#6b7280; --accent:#2563eb; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0b1120; --text:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; } }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .code{font-size:72px; font-weight:800; letter-spacing:-.04em; color:var(--accent); line-height:1}
  h1{font-size:20px; margin:14px 0 8px; font-weight:650}
  p{color:var(--muted); font-size:14px}
  a{display:inline-block; margin-top:22px; color:#fff; background:var(--accent);
    text-decoration:none; font-size:14px; padding:9px 20px; border-radius:9px}
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>地址可能拼错了，或者页面已经被移动。</p>
    <a href="/11HTML/">返回首页</a>
  </div>
</body>
</html>
