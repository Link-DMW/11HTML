<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双十一龙虎榜</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg1:#7d181b; --bg2:#5c1114; --bg3:#3d0a0d;
    --cream:#f6e3c0; --cream2:rgba(246,227,192,.62); --cream3:rgba(246,227,192,.42); --cream4:rgba(246,227,192,.24);
    --gold:#f7d99a; --gold-dim:rgba(247,217,154,.16); --gold-line:rgba(247,217,154,.18);
    --warm:#ff9f8a;
  }
  html{scroll-behavior:smooth}
  body{
    background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 38%, var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .page{position:relative;max-width:900px;margin:0 auto;padding:54px 40px 80px}

  /* ---------- 报头 ---------- */
  header{position:relative;padding:6px 0 26px;border-bottom:1px solid var(--gold-line)}
  .wm{
    position:absolute;right:-6px;top:-16px;font-size:180px;line-height:1;font-weight:800;
    letter-spacing:-.04em;color:rgba(247,217,154,.07);pointer-events:none;user-select:none;
  }
  .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--cream2)}
  h1{font-size:clamp(40px,6.2vw,64px);line-height:1.06;font-weight:800;letter-spacing:.06em;margin:14px 0 12px;color:var(--gold)}
  .range{font-size:12.5px;color:var(--cream2);font-variant-numeric:tabular-nums}
  .range b{color:var(--cream);font-weight:500}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:14px 22px;flex-wrap:wrap}
  .clocks{display:flex;align-items:baseline;gap:16px;font-size:10.5px;letter-spacing:.1em;color:var(--cream3);font-variant-numeric:tabular-nums}
  .clocks b{color:var(--gold);font-weight:500;font-size:13px;letter-spacing:.06em;margin-left:6px}
  .clocks i{font-style:normal;color:rgba(246,227,192,.4);margin-left:5px;font-size:9.5px}

  /* ---------- 三个大数 ---------- */
  .hero{display:grid;grid-template-columns:repeat(2,1fr);padding:28px 0 30px;border-bottom:1px solid var(--gold-line)}
  .hero div{padding-right:18px}
  .hero div + div{border-left:1px solid var(--gold-line);padding-left:22px}
  .hero div span{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--cream2);margin-bottom:10px}
    .hero div i{display:block;margin-top:7px;font-size:9.5px;letter-spacing:.08em;color:rgba(246,227,192,.36);font-style:normal}
.hero div b{font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;color:var(--gold)}
  .hero div.warn b{color:var(--warm)}

  /* ---------- 榜单 ---------- */
  .board-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:30px 0 4px}
  .board-head h2{font-size:12px;letter-spacing:.24em;color:var(--cream2);font-weight:500}
  .sorts{display:flex;gap:2px;flex-wrap:wrap}
  .sorts button{
    cursor:pointer;font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:2px;
    border:1px solid transparent;background:transparent;color:var(--cream3);transition:.15s;
  }
  .sorts button:hover{color:var(--cream)}
  .sorts button.on{color:#4a0f11;background:var(--gold);border-color:var(--gold);font-weight:600}

  .row{
    display:grid;grid-template-columns:56px minmax(0,1fr) 116px 60px 44px;
    gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid rgba(247,217,154,.12);
    cursor:pointer;transition:background .15s;
  }
  .row:hover{background:rgba(255,255,255,.028)}
  .row.open{background:rgba(247,217,154,.07)}
  .row .rk{font-size:28px;font-weight:800;line-height:1;color:var(--cream4);font-variant-numeric:tabular-nums}
  .row.top1 .rk{color:var(--gold)}
  .row.top2 .rk,.row.top3 .rk{color:var(--cream2)}
  .row .mid{min-width:0}
  .row .nm{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
  .row .nm em{font-style:normal;font-size:10px;font-weight:500;color:var(--gold);border:1px solid rgba(247,217,154,.4);border-radius:99px;padding:1px 7px;letter-spacing:.08em}
  .row .bar{height:2px;max-width:220px;background:rgba(247,217,154,.14);margin-top:9px;overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--gold);opacity:.8}
  .row .pay{text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold)}
  .row .pay.dim{color:rgba(246,227,192,.5);font-weight:500}
  .row .pay em{display:block;font-style:normal;font-size:9.5px;font-weight:400;letter-spacing:.02em;
               color:rgba(246,227,192,.42);margin-top:5px;white-space:nowrap}
  .row .time{text-align:right;font-size:11.5px;color:var(--cream3);font-variant-numeric:tabular-nums}
  .row .time.stale{color:var(--warm)}
  .row .chg{text-align:right;font-size:10.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .chg.up{color:#ff9f8a}
  .row .chg.down{color:#8fd0b0}
  .row .chg.flat{color:rgba(246,227,192,.32)}
  .row .chg.new{color:rgba(246,227,192,.5);font-size:9.5px;letter-spacing:.08em}
  .row.all .time{grid-column:4 / span 2}
  .row.all{margin-top:2px;border-top:1px solid var(--gold-line)}
  .row.all .rk{font-size:11px;letter-spacing:.16em;color:var(--cream3);font-weight:400;line-height:1.2}
  .row.all .nm{font-size:15px;color:var(--cream2);font-weight:500}
  .row.all .bar i{background:rgba(247,217,154,.45);opacity:1}
  .row.all .pay{font-size:15px;color:var(--cream2)}

  /* ---------- 展开 ---------- */
  .detail{background:rgba(0,0,0,.16);border-top:1px solid var(--gold-line);border-bottom:1px solid var(--gold-line);padding:20px 22px 24px}
  .detail .chart{margin-bottom:18px}
  .detail .chart svg{display:block;width:100%;height:auto}
  .kv{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:10px}
  .kv div{font-size:11px;color:var(--cream3)}
  .kv div b{display:block;margin-top:5px;font-size:18px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
  .kv div b.warn{color:var(--warm)}
  .note{font-size:11px;color:var(--cream3);line-height:1.8}
  .note b{color:var(--cream2);font-weight:600}
  .ev{margin-top:14px;padding-top:12px;border-top:1px solid rgba(247,217,154,.12);display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
  .ev i{font-style:normal;font-size:11px;color:var(--cream3);display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev i em{font-style:normal;color:var(--cream4);font-variant-numeric:tabular-nums}
  .ev i b{color:var(--cream2);font-weight:600}
  .ev i.up b{color:#a8d9a0}
  .ev i.down b,.ev i.reset b{color:var(--warm)}

  .more{padding:20px 0 0}
  .more button{
    width:100%;cursor:pointer;font-family:inherit;font-size:11.5px;letter-spacing:.14em;
    padding:13px 0;border:1px solid var(--gold-line);background:transparent;color:var(--cream2);
  }
  .more button:hover{color:var(--gold);border-color:rgba(247,217,154,.4)}

  /* ---------- 风险 ---------- */
  .risks{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 0;padding-top:24px;border-top:1px solid var(--gold-line)}
  .risks span{font-size:11px;color:var(--cream3);padding:5px 12px;border:1px solid rgba(247,217,154,.14)}
  .risks span b{color:var(--cream2);font-weight:600;margin-left:6px}
  .risks span.hot{border-color:rgba(255,159,138,.45);background:rgba(255,159,138,.08)}
  .risks span.hot b{color:var(--warm)}

  /* ---------- 明细 ---------- */
  details{margin-top:26px;border-top:1px solid var(--gold-line);padding-top:20px}
  summary{cursor:pointer;font-size:11px;letter-spacing:.24em;color:var(--cream3);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:hover{color:var(--gold)}
  .tbl{margin-top:16px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:840px}
  th{font-size:9.5px;letter-spacing:.06em;color:var(--cream3);font-weight:400;text-align:right;padding:0 0 8px;border-bottom:1px solid var(--gold-line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 0;border-bottom:1px solid rgba(247,217,154,.1);text-align:right;font-variant-numeric:tabular-nums;color:var(--cream2);white-space:nowrap}
  td:first-child{color:var(--cream);font-weight:500}
  .tbl-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
  .tbl-foot span{font-size:10.5px;color:var(--cream4)}
  .tbl-foot button{cursor:pointer;font-family:inherit;font-size:11px;padding:7px 14px;border:1px solid var(--gold-line);background:transparent;color:var(--cream3)}
  .tbl-foot button:hover{color:var(--gold);border-color:rgba(247,217,154,.4)}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid rgba(247,217,154,.1);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--cream4);letter-spacing:.04em}
  footer b{color:var(--cream3);font-weight:500}

  .chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .chart-head .t{font-size:12px;letter-spacing:.14em;color:var(--cream2)}
  .chart-head .t em{font-style:normal;font-size:9.5px;color:var(--cream3);margin-left:7px}
  .chart-tabs{display:flex;gap:2px}
  .chart-tabs button{cursor:pointer;font-family:inherit;font-size:10.5px;padding:3px 9px;border:1px solid transparent;background:transparent;color:var(--cream3)}
  .chart-tabs button:hover{color:var(--cream)}
  .chart-tabs button.on{color:var(--gold);border-color:rgba(247,217,154,.45);background:rgba(247,217,154,.07)}
  .chart-empty{padding:30px 0;color:var(--cream3);font-size:11.5px}
  .chart-legend{display:flex;flex-wrap:wrap;gap:5px 16px;margin:0 0 9px}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--cream2)}
  .chart-legend span i{width:10px;height:2.5px;border-radius:1px;flex:0 0 auto}
  .chart-legend span em{font-style:normal;font-size:10px;color:var(--cream3)}
  .chart-legend .dim{color:rgba(246,227,192,.4)}
  .ov{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;margin:4px 0 6px}
  @media (max-width:820px){ .ov{grid-template-columns:repeat(2,1fr)} }
  .ov .c{background:rgba(0,0,0,.14);border:1px solid rgba(247,217,154,.10);border-radius:2px;padding:9px 10px 5px}
  .ov .c b{display:block;font-size:10.5px;font-weight:400;letter-spacing:.08em;color:var(--cream3)}
  .ov .c .v{display:block;font-size:14.5px;color:var(--gold);margin:1px 0 5px;font-variant-numeric:tabular-nums}
  .ov .c .v i{font-style:normal;font-size:9.5px;color:var(--cream3);margin-left:2px}
  .ov .mini svg{display:block;width:100%;height:auto}
  #ctip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .1s;
    background:#2a0b0d;border:1px solid rgba(247,217,154,.45);padding:9px 12px;
    font-size:11px;line-height:1.65;color:#f6e3c0;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #ctip b{color:#f7d99a;font-weight:600}
  #ctip i{font-style:normal;color:rgba(246,227,192,.55)}
  #ctip em{font-style:normal;font-size:10px}
  #ctip.on{opacity:1}
  .empty{padding:36px 0;color:var(--cream3);font-size:12px}
  .banner{margin-top:24px;padding:16px;border:1px solid rgba(255,159,138,.45);background:rgba(255,159,138,.08);font-size:12px;line-height:1.8;color:var(--warm)}

  @media (max-width:700px){
    .page{padding:34px 20px 56px}
    .wm{font-size:110px;top:-4px}
    .hero{padding:22px 0 24px}
    .hero div + div{padding-left:14px}
    .hero div b{font-size:25px}
    .row{grid-template-columns:34px minmax(0,1fr) auto 34px;grid-template-rows:auto auto;gap:0 10px;padding:13px 0}
    .row .rk{font-size:21px;grid-row:1/3;align-self:center}
    .row .mid{grid-row:1/3;grid-column:2;align-self:center}
    .row .bar{max-width:none;margin-top:7px}
    .row .pay{grid-row:1;grid-column:3;align-self:end;font-size:15px}
    .row .time{grid-row:2;grid-column:3;align-self:start;text-align:right}
    .row .chg{grid-row:1/3;grid-column:4;align-self:center;justify-self:end;font-size:10px}
    .row.all{grid-template-columns:34px minmax(0,1fr) auto}
    .detail{padding:16px 14px 18px}
    .ev{grid-template-columns:1fr}
  }

</style>
</head>
<body>
<div id="ctip"></div>
<div class="page">

  <header>
    <div class="wm">11.11</div>
    <div class="eyebrow">2026 双十一 · 战报</div>
    <h1>龙虎榜</h1>
    <div class="hrow">
      <div class="range" id="range">正在读取…</div>
      <div class="clocks" id="clocks"></div>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <section>
    <div class="board-head">
      <h2>榜单</h2>
      <div class="sorts" id="sorts"></div>
    </div>
    <div id="rows"></div>
    <div class="more" id="more"></div>
  </section>

  <div class="risks" id="risks"></div>

  <details>
    <summary>数据明细</summary>
    <div class="tbl"><table id="tbl"></table></div>
    <div class="tbl-foot">
      <span id="meta"></span>
      <button id="csv">导出 CSV</button>
    </div>
  </details>

  <footer>
    <span>最新快照 <b id="snap">—</b></span>
    <span>数据源 shop_data_readonly.db · 由 刷新龙虎榜.bat 重新生成</span>
  </footer>
</div>

<script src="shop_data.js?v=20261029193400"></script>
<script>
(function(){
  'use strict';

  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); };
  var num = function(v){ var n = parseFloat(String(v==null?0:v).replace(/[^\-\d.]/g,'')); return isFinite(n)?n:0; };
  var fmtInt = function(n){ return Math.round(num(n)).toLocaleString('en-US'); };
  var fmtMoney = function(n){ return num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var clamp = function(n,a,b){ return Math.min(b,Math.max(a,n)); };

  /* ================= 数据 ================= */
  var RAW = window.SHOP_DATA || null;
  var NUMKEYS = ['sales','views','visitors','disputes','balance','popDisputes','popPay','popVisitors','popOrders','cvr'];
  var HAS_AD = !!(RAW && Array.isArray(RAW.stores) && RAW.stores.some(function(s){
    return s && Object.prototype.hasOwnProperty.call(s, 'adSpend');
  }));

  function normStore(s){
    var o = { name:String(s&&s.name||''), ts:String(s&&s.ts||''), tsWest:String(s&&s.tsWest||'') };
    NUMKEYS.forEach(function(k){ o[k] = num(s?s[k]:0); });
    o.adSpend = (s && s.adSpend != null) ? num(s.adSpend) : null;
    o.history = Array.isArray(s && s.history) ? s.history : [];
    return o;
  }

  var stores = [], emptyStores = [];
  if(RAW && Array.isArray(RAW.stores)){
    stores = RAW.stores.map(normStore);
    emptyStores = Array.isArray(RAW.emptyStores) ? RAW.emptyStores : [];
  }

  /* ================= 指标 ================= */
  var METRICS = [
    { k:'score', label:'综合' },
    { k:'popPay', label:'支付' },
    { k:'visitors', label:'访客' },
    { k:'disputes', label:'纠纷' },
    { k:'ts', label:'时间' }
  ];
  var activeMetric = 'score';
  var expanded = '';
  var allOpen = false;
  var boardExpanded = false;
  var LIMIT = 10;

  /* ============ 今日支付 ============ */
  /* 全托没有「成交金额」字段，用「全托余额」当天的增量当作全托侧的新增支付：
     余额 = 已结算到账的钱，只取正增量（提现/扣费不参与）。 */
  var REF_DAY = 0;
  function refDay(){
    if(!REF_DAY){
      REF_DAY = dayKey(RAW && RAW.latestSnapshot ? parseTs(RAW.latestSnapshot).getTime() : Date.now());
    }
    return REF_DAY;
  }
  function balGainAt(hist, idx, day){
    if(!hist || idx < 0 || idx >= hist.length) return 0;
    var start = null, i;
    for(i=0;i<=idx;i++){
      if(dayKey(parseTs(hist[i].ts).getTime()) === day){ start = num(hist[i].balance); break; }
    }
    if(start == null) start = num(hist[0].balance);
    return Math.max(0, num(hist[idx].balance) - start);
  }
  function computePay(list){
    var day = refDay();
    list.forEach(function(s){
      var h = (s.history || []).slice().sort(function(a,b){
        return parseTs(a.ts).getTime() - parseTs(b.ts).getTime();
      });
      for(var i=0;i<h.length;i++){
        h[i]._pay = num(h[i].popPay) + balGainAt(h, i, day);
      }
      s.history = h;
      s._balGain = balGainAt(h, h.length-1, day);
      s._pay = num(s.popPay) + s._balGain;
    });
  }

  function computeScores(list){
    var W = { popPay:.26, sales:.18, popOrders:.14, cvr:.14, visitors:.10, popVisitors:.08, views:.06, balance:.04 };
    var max = {}, ws = 0;
    Object.keys(W).forEach(function(k){
      ws += W[k];
      max[k] = Math.max.apply(null, list.map(function(s){ return s[k]||0; }));
      if(!(max[k] > 0)) max[k] = 1;
    });
    var dmax = Math.max.apply(null, list.map(function(s){ return (s.disputes||0)+(s.popDisputes||0); })) || 1;
    return list.map(function(s){
      var sum = 0;
      Object.keys(W).forEach(function(k){ sum += W[k] * ((s[k]||0) / max[k]); });
      var base = (sum / ws) * 100;
      var pen = 8 * (((s.disputes||0)+(s.popDisputes||0)) / dmax);
      return Math.max(0, Math.round((base - pen) * 10) / 10);
    });
  }

  function ranked(){
    var list = stores.slice();
    var scores = computeScores(list);
    list.forEach(function(s,i){ s._score = scores[i]; });
    var f = {
      score: function(s){ return s._score; },
      popPay: function(s){ return s._pay; },
      visitors: function(s){ return s.visitors; },
      disputes: function(s){ return (s.disputes||0)+(s.popDisputes||0); },
      ts: function(s){ return parseTs(s.ts).getTime(); }
    }[activeMetric];
    list.sort(function(a,b){ return f(b) - f(a); });
    return list;
  }

  /* 上一次快照的排名（用来算名次升降） */
  var PREV_RANK = {};
  var PREV_KEYS = ['sales','views','visitors','disputes','balance','popDisputes','popPay','popVisitors','popOrders','cvr'];
  function prevRankMap(){
    var list = [];
    stores.forEach(function(st){
      var h = st.history || [];
      if(h.length < 2) return;
      var r = h[h.length-2];
      var o = { name:st.name, ts:String(r.ts||'') };
      PREV_KEYS.forEach(function(k){ o[k] = num(r[k]); });
      var hh = (st.history || []).slice().sort(function(x,y){
        return parseTs(x.ts).getTime() - parseTs(y.ts).getTime();
      });
      o._pay = num(r.popPay) + balGainAt(hh, hh.length-2, refDay());
      list.push(o);
    });
    if(!list.length) return {};
    var scores = computeScores(list);
    list.forEach(function(x,i){ x._score = scores[i]; });
    var f = {
      score: function(x){ return x._score; },
      popPay: function(x){ return x.popPay; },
      visitors: function(x){ return x.visitors; },
      disputes: function(x){ return (x.disputes||0)+(x.popDisputes||0); },
      ts: function(x){ return parseTs(x.ts).getTime(); }
    }[activeMetric];
    list.sort(function(x,y){ return f(y) - f(x); });
    var map = {};
    list.forEach(function(x,i){ map[x.name] = i+1; });
    return map;
  }

  /* ================= 时间 ================= */
  function parts(d, tz){
    var o = {};
    new Intl.DateTimeFormat('en-CA',{
      timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
    }).formatToParts(d).forEach(function(p){ if(p.type !== 'literal') o[p.type] = p.value; });
    return o;
  }
  function hm(ts){
    if(typeof ts === 'number'){ var p = parts(new Date(ts),'Asia/Shanghai'); return p.hour+':'+p.minute; }
    return String(ts||'').slice(11,16);
  }
  function dm(ts){
    if(typeof ts === 'number'){ var p = parts(new Date(ts),'Asia/Shanghai'); return p.month+'-'+p.day; }
    return String(ts||'').slice(5,10);
  }
  /* 实时时钟：北京 / 美西（客户端算，部署到 Pages 也是准的） */
  function tzParts(ms, tz, withDay){
    try{
      var f = new Intl.DateTimeFormat('en-GB', {
        timeZone: tz, hour12: false,
        hour:'2-digit', minute:'2-digit', second:'2-digit',
        month:'2-digit', day:'2-digit'
      });
      var parts = f.formatToParts(new Date(ms)), out = {};
      parts.forEach(function(p){ out[p.type] = p.value; });
      var hh = out.hour === '24' ? '00' : out.hour;
      return { time: hh+':'+out.minute+':'+out.second, day: out.month+'-'+out.day };
    }catch(e){
      var off = (tz === 'Asia/Shanghai') ? 8 : -7;
      var d = new Date(ms + off*3600000);
      var p2 = function(n){ return (n<10?'0':'')+n; };
      return { time: p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds()),
               day: p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()) };
    }
  }
  /* 页面数据更新到哪个时刻（美西口径） */
  var UPDATE_STR = '';
  function computeUpdate(){
    var best = null;
    stores.forEach(function(st){ if(!best || parseTs(st.ts) > parseTs(best.ts)) best = st; });
    if(!best) return '';
    var west = String(best.tsWest || '');
    if(west.length >= 16) return west.slice(11,16) + '|' + west.slice(5,10);
    try{
      var p = parts(hourShift(best.ts),'America/Los_Angeles');
      return p.hour+':'+p.minute + '|' + p.month+'-'+p.day;
    }catch(err){ return ''; }
  }
  function hourShift(ts){ return new Date(parseTs(ts).getTime()); }
  function tickClocks(){
    var el = document.getElementById('clocks');
    if(!el) return;
    var now = Date.now();
    var bj = tzParts(now, 'Asia/Shanghai');
    var us = tzParts(now, 'America/Los_Angeles');
    var upd = UPDATE_STR ? UPDATE_STR.split('|') : null;
    el.innerHTML =
      '<span>北京<b>'+bj.time+'</b></span>' +
      '<span>美西<b>'+us.time+'</b><i>'+us.day+'</i></span>' +
      (upd ? '<span>更新<b>'+upd[0]+'</b><i>'+upd[1]+'</i></span>' : '');
  }

  function fmtRange(a,b){ return (!a||!b) ? '—' : dm(a)+' '+hm(a)+' – '+dm(b)+' '+hm(b); }
  function parseTs(str){ return new Date(String(str||'').replace(' ','T')+'+08:00'); }
  function lagMin(s){
    if(!(RAW && RAW.latestSnapshot) || !s.ts) return 0;
    return Math.max(0, Math.round((parseTs(RAW.latestSnapshot) - parseTs(s.ts)) / 60000));
  }
  function usDay(tsWest){ return String(tsWest||'').slice(0,10); }

  /* ================= 图表 ================= */
  var TZ_OFF = 8*3600000, GAP_CAP = 7200000, MIN_BIN_MIN = 6;

  function visValue(r){ return num(r.visitors) + num(r.popVisitors); }

  function buildWindows(s){
    var h = s.history || [], out = [];
    for(var i=1;i<h.length;i++){
      var a = h[i-1], b = h[i];
      var ta = parseTs(a.ts), tb = parseTs(b.ts);
      var durH = (tb-ta)/3600000;
      if(!(durH > 0)) continue;
      var cross = usDay(a.tsWest) !== usDay(b.tsWest);
      var dv = cross ? 0 : Math.max(0, visValue(b) - visValue(a));
      out.push({ ta:ta.getTime(), tb:tb.getTime(), dur:durH, dv:dv, tsa:a.ts, tsb:b.ts });
    }
    return out;
  }

  function timelineBins(list, minMin){
    var pts = [];
    list.forEach(function(s){ (s.history||[]).forEach(function(r){ pts.push(parseTs(r.ts).getTime()); }); });
    pts.sort(function(a,b){ return a-b; });
    var uniq = [];
    pts.forEach(function(t){ if(!uniq.length || t-uniq[uniq.length-1] > 60000) uniq.push(t); });
    if(uniq.length < 2) return [];
    var minMs = (minMin || MIN_BIN_MIN)*60000;
    var edges = [uniq[0]];
    for(var i=1;i<uniq.length;i++){ if(uniq[i]-edges[edges.length-1] >= minMs) edges.push(uniq[i]); }
    if(edges[edges.length-1] !== uniq[uniq.length-1]) edges.push(uniq[uniq.length-1]);
    var bins = [];
    for(var j=0;j<edges.length-1;j++) bins.push({ t0:edges[j], t1:edges[j+1], sol:0, est:0 });
    return bins;
  }

  function fillBins(bins, list){
    list.forEach(function(s){
      buildWindows(s).forEach(function(w){
        if(w.dv <= 0) return;
        for(var i=0;i<bins.length;i++){
          var b = bins[i];
          var lo = Math.max(b.t0, w.ta), hi = Math.min(b.t1, w.tb);
          if(hi <= lo) continue;
          var f = (hi-lo)/(w.tb-w.ta);
          if(w.dur*60 <= 45) b.sol += w.dv*f; else b.est += w.dv*f;
        }
      });
    });
  }

  function storeStats(list){
    var bins = timelineBins(list, list.length === 1 ? 1 : MIN_BIN_MIN);
    fillBins(bins, list);
    var total = 0, sol = 0;
    bins.forEach(function(b){ total += b.sol+b.est; sol += b.sol; });
    var t0 = bins.length ? bins[0].t0 : 0, t1 = bins.length ? bins[bins.length-1].t1 : 0;
    var eff = 0;
    bins.forEach(function(b){ var d = (b.t1-b.t0)/3600000; if(d <= 3) eff += d; });
    return { bins:bins, total:total, sol:sol, t0:t0, t1:t1, effH:eff, avg: eff>0 ? total/eff : 0 };
  }

  function fmtAxis(v){
    if(Math.abs(v) >= 10000) return (v/10000).toFixed(1)+'万';
    if(Math.abs(v) >= 1000) return (v/1000).toFixed(1)+'k';
    return String(Math.round(v*10)/10);
  }
  function niceMax(v){
    if(v <= 0) return 10;
    var e = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
    var steps = [1,1.5,2,2.5,3,4,5,6,8,10];
    for(var i=0;i<steps.length;i++){ if(v <= steps[i]*e) return steps[i]*e; }
    return 10*e;
  }
  function defs(id){
    return '<defs><pattern id="ch-'+id+'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="6" height="6" fill="#5a1618"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6d2a26" stroke-width="1.1"/></pattern></defs>';
  }

  function svgBars(bins, o){
    o = o || {};
    if(!bins.length) return '<div class="empty">没有可画的采样区间</div>';
    var id = o.id || 'a';
    var W = o.width || 880, H = o.height || 220;
    var L = 44, R = 46, T = 22, B = 26;
    var iw = W-L-R, ih = H-T-B, font = 10;
    var rd = function(n){ return Math.round(n*10)/10; };

    var totalW = 0;
    bins.forEach(function(b){ b._w = Math.min(b.t1-b.t0, GAP_CAP); totalW += b._w; });
    var scale = iw/(totalW||1), acc = 0;
    bins.forEach(function(b){ b._x0 = L+acc*scale; acc += b._w; b._x1 = L+acc*scale; });
    function Xt(t){
      for(var i=0;i<bins.length;i++){
        var b = bins[i];
        if(t <= b.t1){ var f = (t-b.t0)/Math.max(1,b.t1-b.t0); return b._x0 + clamp(f,0,1)*(b._x1-b._x0); }
      }
      return W-R;
    }

    var maxV = 0, cum = 0;
    bins.forEach(function(b){
      var v = b.sol+b.est; cum += v;
      if((b.t1-b.t0) > GAP_CAP) return;
      if(v > maxV) maxV = v;
    });
    if(maxV <= 0) maxV = cum || 1;
    var top = niceMax(maxV*1.08);
    var Y = function(v){ return T+ih - v/top*ih; };
    var CY = function(v){ return T+ih - v/Math.max(1, cum*1.03)*ih; };
    var tStart = bins[0].t0, tEnd = bins[bins.length-1].t1;

    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">' + defs(id);
    [0,.5,1].forEach(function(f){
      var y = rd(Y(top*f));
      s += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(247,217,154,.14)" stroke-width="1"/>';
      s += '<text x="'+(L-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="rgba(246,227,192,.55)">'+fmtAxis(top*f)+'</text>';
    });

    function inGap(t){
      for(var i=0;i<bins.length;i++){
        var b = bins[i];
        if((b.t1-b.t0) > GAP_CAP && t > b.t0 && t < b.t1) return true;
      }
      return false;
    }

    var peak = null;
    bins.forEach(function(b){
      if((b.t1-b.t0) > GAP_CAP) return;
      var v = b.sol+b.est;
      if(!peak || v > peak.v) peak = { v:v, b:b };
    });

    var yb = T+ih;
    bins.forEach(function(b){
      var total = b.sol+b.est, w = Math.max(1.2, b._x1-b._x0-1);
      var cap = (b.t1-b.t0) > GAP_CAP, gapH = (b.t1-b.t0)/3600000;

      if(cap){
        s += '<rect x="'+rd(b._x0)+'" y="'+rd(T)+'" width="'+rd(w)+'" height="'+rd(ih)+'" fill="#000000" opacity=".2"/>';
        var gx = (b._x0+b._x1)/2;
        s += '<line x1="'+rd(gx-3)+'" y1="'+rd(T)+'" x2="'+rd(gx+3)+'" y2="'+rd(T+ih)+'" stroke="rgba(247,217,154,.4)" stroke-width="1.3"/>';
        s += '<line x1="'+rd(gx+2)+'" y1="'+rd(T)+'" x2="'+rd(gx+8)+'" y2="'+rd(T+ih)+'" stroke="rgba(247,217,154,.4)" stroke-width="1.3"/>';
        var gw = b._x1 - b._x0;
        if(gw > 62){
          var txt = '断采 ' + (gapH >= 10 ? Math.round(gapH)+'h' : Math.round(gapH*60)+'m');
          if(gw > 120 && total > 0) txt += ' · +' + fmtInt(total);
          s += '<text x="'+rd(gx)+'" y="'+rd(T+30)+'" text-anchor="middle" font-size="9.5" fill="rgba(246,227,192,.55)">'+txt+'</text>';
        }
        return;
      }
      if(total <= 0){
        s += '<rect x="'+rd(b._x0)+'" y="'+rd(yb-3)+'" width="'+rd(w)+'" height="3" fill="url(#ch-'+id+')" opacity=".5"/>';
        return;
      }
      var hS = b.sol/top*ih, hE = b.est/top*ih;
      if(hS > .4) s += '<rect x="'+rd(b._x0)+'" y="'+rd(yb-hS)+'" width="'+rd(w)+'" height="'+rd(hS)+'" fill="#e8c07a"/>';
      if(hE > .4){
        s += '<rect x="'+rd(b._x0)+'" y="'+rd(yb-hS-hE)+'" width="'+rd(w)+'" height="'+rd(hE)+'" fill="#6d2a26"/>';
        s += '<rect x="'+rd(b._x0)+'" y="'+rd(yb-hS-hE)+'" width="'+rd(w)+'" height="'+rd(hE)+'" fill="url(#ch-'+id+')" opacity=".5"/>';
      }
      s += '<rect x="'+rd(b._x0)+'" y="'+rd(yb-hS-hE)+'" width="'+rd(w)+'" height="'+rd(hS+hE)+'" fill="transparent">'+
        '<title>'+hm(b.t0)+'–'+hm(b.t1)+' · '+Math.round((b.t1-b.t0)/60000)+' 分钟 · +'+fmtInt(total)+' 人</title></rect>';
    });

    if(peak && peak.v > 0){
      s += '<text x="'+rd((peak.b._x0+peak.b._x1)/2)+'" y="'+rd(Y(peak.v)-7)+'" text-anchor="middle" font-size="10" fill="#ffe9c0">'+fmtInt(peak.v)+'</text>';
    }

    if(cum > 0){
      var run = 0, pts = [];
      bins.forEach(function(b){ run += b.sol+b.est; pts.push({ x:b._x1, v:run }); });
      s += '<path d="'+pts.map(function(p,i){ return (i?'L':'M')+rd(p.x)+','+rd(CY(p.v)); }).join(' ')+'" fill="none" stroke="#ffe0a8" stroke-width="1.3" opacity=".9"/>';
      s += '<text x="'+(W-R+6)+'" y="'+rd(CY(cum)+3)+'" font-size="9.5" fill="#ffe0a8">'+fmtAxis(cum)+'</text>';
    }

    if((tEnd-tStart) > 86400000){
      var mid = Math.ceil((tStart+TZ_OFF)/86400000)*86400000 - TZ_OFF;
      for(; mid<=tEnd; mid+=86400000){
        var dx = Xt(mid), pp = parts(new Date(mid),'Asia/Shanghai');
        s += '<line x1="'+rd(dx)+'" y1="'+T+'" x2="'+rd(dx)+'" y2="'+(T+ih)+'" stroke="rgba(247,217,154,.4)" stroke-width="1" stroke-dasharray="2 3"/>';
        s += '<text x="'+rd(dx+3)+'" y="'+(T+10)+'" font-size="9.5" fill="rgba(246,227,192,.55)">'+pp.month+'-'+pp.day+'</text>';
      }
      var h4 = Math.ceil((tStart+TZ_OFF)/14400000)*14400000 - TZ_OFF;
      for(; h4<=tEnd; h4+=14400000){
        var x4 = Xt(h4); if(x4-L<20 || (W-R)-x4<24) continue;
        var p4 = parts(new Date(h4),'Asia/Shanghai');
        if(p4.hour === '00') continue;
        if(inGap(h4)) continue;
        s += '<text x="'+rd(x4)+'" y="'+(T+ih+18)+'" text-anchor="middle" font-size="9.5" fill="rgba(246,227,192,.55)">'+p4.hour+':00</text>';
      }
    }else{
      var hh = Math.ceil((tStart+TZ_OFF)/3600000)*3600000 - TZ_OFF;
      for(; hh<=tEnd; hh+=3600000){
        if(inGap(hh)) continue;
        var hx = Xt(hh); if(hx-L<26 || (W-R)-hx<30) continue;
        s += '<text x="'+rd(hx)+'" y="'+(T+ih+18)+'" text-anchor="middle" font-size="9.5" fill="rgba(246,227,192,.55)">'+hm(hh)+'</text>';
      }
    }

    s += '</svg>';
    return s;
  }

  function events(s){
    var h = s.history || [], out = [];
    for(var i=1;i<h.length;i++){
      var a = h[i-1], b = h[i];
      var ta = parseTs(a.ts), tb = parseTs(b.ts), gap = Math.round((tb-ta)/60000);
      if(usDay(a.tsWest) !== usDay(b.tsWest)){
        out.push({ t:tb.getTime(), ts:b.ts, kind:'reset', txt:'跨日归零', d:'¥'+fmtMoney(a.popPay)+' → ¥'+fmtMoney(b.popPay) });
        continue;
      }
      if(gap >= 90) out.push({ t:tb.getTime(), ts:b.ts, kind:'gap', txt:'断采 '+gap+' 分钟', d:hm(a.ts)+' → '+hm(b.ts) });
      var dp = num(b.popPay)-num(a.popPay);
      if(num(a.popPay) > 0 && Math.abs(dp) >= Math.max(30, num(a.popPay)*.4)){
        out.push({ t:tb.getTime(), ts:b.ts, kind: dp>0?'up':'down', txt:(dp>0?'跳增 ':'跳减 ')+'¥'+fmtMoney(Math.abs(dp)), d:'¥'+fmtMoney(a.popPay)+' → ¥'+fmtMoney(b.popPay) });
      }
      if(num(a.popOrders) === 0 && num(b.popOrders) > 0){
        out.push({ t:tb.getTime(), ts:b.ts, kind:'up', txt:'首笔成交', d:fmtInt(b.popOrders)+' 单' });
      }
    }
    out.sort(function(x,y){ return y.t-x.t; });
    return out.slice(0,4);
  }

  /* ================= 广告 ================= */

  function renderHero(){

  function rowHTML(s, idx, maxScore){
    var pct = clamp((s._score||0)/maxScore*100, 3, 100);

  /* ================= 图表 ================= */
  var CHART = { metric:'visitors', cum:false, hits:{} };
  var CMET = {
    visitors:{ name:'访客', unit:'人', raw:function(r){ return num(r.visitors)+num(r.popVisitors); } },
    pay:{ name:'支付', unit:'¥', raw:function(r){ return (r && r._pay != null) ? num(r._pay) : num(r.popPay); } },
    orders:{ name:'订单', unit:'单', raw:function(r){ return num(r.popOrders); } }
  };
  var GAP_W = 2*3600000;
  var MPAL = ['#ffe6b8','#f2b552','#ff9f8a','#8fd0b0','#9fb8e8','#cfa8e0'];
  var MMAX = 6;

  function dayKey(ms){
    var d = new Date(ms + 8*3600000 - 15*3600000);
    return d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate();
  }
  function allTimes(list){
    var arr=[];
    list.forEach(function(st){ (st.history||[]).forEach(function(r){ arr.push(parseTs(r.ts).getTime()); }); });
    arr.sort(function(a,b){ return a-b; });
    var out=[];
    arr.forEach(function(t){ if(!out.length || t-out[out.length-1] > 60000) out.push(t); });
    return out;
  }
  function seriesFor(list, key){
    var def = CMET[key], times = allTimes(list);
    var rows = list.map(function(st){
      return (st.history||[]).map(function(r){ return { t:parseTs(r.ts).getTime(), v:def.raw(r) }; });
    });
    return times.map(function(t){
      var v = 0, any = false;
      rows.forEach(function(hs){
        var best = null;
        for(var i=0;i<hs.length;i++){ if(hs[i].t <= t) best = hs[i]; else break; }
        if(best){ v += best.v; any = true; }
      });
      return { t:t, v: any ? v : 0 };
    });
  }
  function barsFor(pts){
    var posSum=0, posH=0, i;
    for(i=1;i<pts.length;i++){
      var dt=(pts[i].t-pts[i-1].t)/3600000;
      if(dt<=0 || dayKey(pts[i].t)!==dayKey(pts[i-1].t)) continue;
      var dv=pts[i].v-pts[i-1].v;
      if(dv>0){ posSum+=dv; posH+=dt; }
    }
    var avgRate = posH>0 ? posSum/posH : 0;
    var out=[];
    for(i=1;i<pts.length;i++){
      var d=(pts[i].t-pts[i-1].t)/3600000;
      if(d<=0) continue;
      var cross = dayKey(pts[i].t)!==dayKey(pts[i-1].t);
      var v = cross ? avgRate*d : Math.max(0, pts[i].v-pts[i-1].v);
      out.push({ t0:pts[i-1].t, t1:pts[i].t, v:v });
    }
    return out;
  }

  /* 统一坐标：长空档压到 GAP_W 宽，柱子/曲线都挨着 */
  function geom(times){
    var W=880, H=280, L=46, R=54, T=26, B=42;
    var iw=W-L-R, ih=H-T-B;
    var widths=[], total=0, i;
    for(i=1;i<times.length;i++){
      var w=Math.min(times[i]-times[i-1], GAP_W);
      widths.push(w); total+=w;
    }
    total = total||1;
    var scale=iw/total, acc=0, xs=[L];
    widths.forEach(function(w){ acc+=w; xs.push(L+acc*scale); });
    var t0=times[0], t1=times[times.length-1];
    function Xof(t){
      if(t<=t0) return L;
      for(var k=1;k<times.length;k++){
        if(t<=times[k]){
          var f=(t-times[k-1])/Math.max(1,times[k]-times[k-1]);
          return xs[k-1]+f*(xs[k]-xs[k-1]);
        }
      }
      return L+iw;
    }
    return { W:W,H:H,L:L,R:R,T:T,B:B,iw:iw,ih:ih,xs:xs,t0:t0,t1:t1,Xof:Xof,
             rd:function(n){ return Math.round(n*10)/10; } };
  }
  function gridSvg(g, Y, top){
    var s='';
    [0,.5,1].forEach(function(f){
      var y=g.rd(Y(top*f));
      s+='<line x1="'+g.L+'" y1="'+y+'" x2="'+(g.W-g.R)+'" y2="'+y+'" stroke="rgba(247,217,154,.12)"/>';
      s+='<text x="'+(g.L-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9" fill="rgba(246,227,192,.45)">'+fmtAxis(top*f)+'</text>';
    });
    return s;
  }
  function timeAxisSvg(g){
    var s='', rd=g.rd, T=g.T, ih=g.ih, W=g.W, R=g.R, L=g.L, t0=g.t0, t1=g.t1, Xof=g.Xof;
    if(t1-t0 > 86400000){
      var mid=Math.ceil((t0+8*3600000)/86400000)*86400000 - 8*3600000;
      var bounds=[t0];
      for(; mid<t1; mid+=86400000){
        var mx=Xof(mid), pp=parts(new Date(mid),'Asia/Shanghai');
        bounds.push(mid);
        s+='<line x1="'+rd(mx)+'" y1="'+T+'" x2="'+rd(mx)+'" y2="'+(T+ih)+'" stroke="rgba(247,217,154,.3)" stroke-dasharray="2 3"/>';
        s+='<text x="'+rd(mx+3)+'" y="'+(T+10)+'" font-size="9" fill="rgba(246,227,192,.55)">'+pp.month+'-'+pp.day+'</text>';
      }
      bounds.push(t1);
      var cy=T+ih+28;
      for(var bi=0;bi<bounds.length-1;bi++){
        var ba=Xof(bounds[bi]), bb=Xof(bounds[bi+1]);
        if(bb-ba<8) continue;
        s+='<line x1="'+rd(ba)+'" y1="'+cy+'" x2="'+rd(bb)+'" y2="'+cy+'" stroke="rgba(247,217,154,.28)"/>';
        s+='<line x1="'+rd(ba)+'" y1="'+(cy-3)+'" x2="'+rd(ba)+'" y2="'+(cy+3)+'" stroke="rgba(247,217,154,.45)"/>';
        s+='<line x1="'+rd(bb)+'" y1="'+(cy-3)+'" x2="'+rd(bb)+'" y2="'+(cy+3)+'" stroke="rgba(247,217,154,.45)"/>';
        if(bb-ba>34){
          var pb=parts(new Date(bounds[bi]),'Asia/Shanghai');
          s+='<text x="'+rd((ba+bb)/2)+'" y="'+(cy+13)+'" text-anchor="middle" font-size="9" fill="rgba(246,227,192,.55)">'+pb.month+'-'+pb.day+'</text>';
        }
      }
    }else{
      var hh=Math.ceil((t0+8*3600000)/3600000)*3600000-8*3600000;
      for(; hh<=t1; hh+=3600000){
        var hx=Xof(hh);
        if(hx-L<50 || (W-R)-hx<56) continue;
        s+='<text x="'+rd(hx)+'" y="'+(T+ih+18)+'" text-anchor="middle" font-size="9" fill="rgba(246,227,192,.45)">'+hm(hh)+'</text>';
      }
    }
    s+='<text x="'+L+'" y="'+(T+ih+18)+'" font-size="9" fill="rgba(246,227,192,.62)">'+hm(t0)+'</text>';
    s+='<text x="'+(W-R)+'" y="'+(T+ih+18)+'" text-anchor="end" font-size="9" fill="rgba(246,227,192,.62)">'+hm(t1)+'</text>';
    return s;
  }
  function valText(v, key, def){
    if(key === 'pay') return '¥'+fmtMoney(v);
    return fmtInt(v)+' '+def.unit;
  }
  function headHTML(title, unit, key, cum, trend, showPay){
    return '<div class="chart-head">' +
        '<div class="t">'+title+'<em>'+unit+'</em></div>' +
        '<div class="chart-tabs">' +
          (trend === false ? '' : '<button data-cum="1" class="'+(cum?'on':'')+'">总览</button>') +
          '<button data-m="visitors" class="'+(key==='visitors'?'on':'')+'">访客</button>' +
          (showPay === false ? '' : '<button data-m="pay" class="'+(key==='pay'?'on':'')+'">支付</button>') +
          '<button data-m="orders" class="'+(key==='orders'?'on':'')+'">订单</button>' +
        '</div>' +
      '</div>';
  }
  /* 只有全托数据的店没有 POP 支付，不给它「支付」按钮 */
  function hasPOP(list){
    return (list || []).some(function(st){
      return (st.history || []).some(function(r){
        return num(r.popPay) > 0 || num(r.popVisitors) > 0 || num(r.popOrders) > 0;
      });
    });
  }
  function chartBox(id, s){
    return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 880 280">'+s+'</svg></div>';
  }

  /* 单店：柱子（窗口新增）/ 走势（计数原始值） */
  /* 总览：全托/POP/广告 各指标原始值随时间的曲线（无柱子） */
  var OVF = [
    { k:'visitors',    name:'全托访客', unit:'人', col:'#f2b552', money:false },
    { k:'popVisitors', name:'POP访客',  unit:'人', col:'#7fd7d1', money:false },
    { k:'popPay',      name:'POP金额',  unit:'¥',  col:'#cfa8e0', money:true  }
  ];

  function overviewBlock(list, id){
    var times = allTimes(list);
    var showPay = hasPOP(list);
    if(times.length < 2) return '<div class="chart-empty">采样点太少，画不了</div>';

    var g = geom(times), L=g.L, T=g.T, ih=g.ih, W=g.W, R=g.R, rd=g.rd;

    var rows = (list[0].history || []).slice().map(function(r){
      return { t:parseTs(r.ts).getTime(), r:r };
    }).sort(function(a,b){ return a.t-b.t; });

    var series = OVF.map(function(f){
      var vals = times.map(function(t){
        var best=null;
        for(var k=0;k<rows.length;k++){ if(rows[k].t<=t) best=rows[k].r; else break; }
        return best ? num(best[f.k]) : null;
      });
      var max=0, last=null;
      vals.forEach(function(v){ if(v!=null && v>max) max=v; });
      for(var q=vals.length-1;q>=0;q--){ if(vals[q]!=null){ last=vals[q]; break; } }
      return { f:f, vals:vals, max:max, last:last };
    });

    var maxAll=0;
    series.forEach(function(o){ if(o.max>maxAll) maxAll=o.max; });
    var top = niceMax(maxAll*1.05 || 10);
    var Y = function(v){ return T+ih - Math.min(v,top)/top*ih; };

    var s = '';
    [0,.5,1].forEach(function(f){
      var y=rd(Y(top*f));
      s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(247,217,154,.12)"/>';
      s+='<text x="'+(L-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9" fill="rgba(246,227,192,.42)">'+fmtAxis(top*f)+'</text>';
    });

    var defs='';
    series.forEach(function(o){
      defs+='<linearGradient id="ovg'+id+o.f.k+'" x1="0" y1="0" x2="0" y2="1">'+
            '<stop offset="0" stop-color="'+o.f.col+'" stop-opacity=".16"/>'+
            '<stop offset="1" stop-color="'+o.f.col+'" stop-opacity="0"/></linearGradient>';
    });
    s = '<defs>'+defs+'</defs>' + s;

    /* 每个真实采样点都画，点与点用平滑曲线连起来：全程一条，不断 */
    series.forEach(function(o){
      var pts=[];
      for(var i=0;i<o.vals.length;i++){
        if(o.vals[i]==null) continue;
        pts.push({ x:g.xs[i], y:Y(o.vals[i]) });
      }
      if(pts.length<2) return;
      var d=smoothPath(pts, rd);
      s+='<path d="'+d+' L'+rd(pts[pts.length-1].x)+','+(T+ih)+' L'+rd(pts[0].x)+','+(T+ih)+' Z" fill="url(#ovg'+id+o.f.k+')"/>';
      s+='<path d="'+d+'" fill="none" stroke="'+o.f.col+'" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>';
    });

    var hits=[];
    for(var i=1;i<times.length;i++){
      var items=[];
      series.forEach(function(o){
        var v=o.vals[i];
        if(v==null) return;
        items.push({ name:o.f.name, color:o.f.col, txt:(o.f.money ? '¥'+fmtMoney(v) : fmtInt(v)+' '+o.f.unit) });
      });
      hits.push({ x0:g.xs[i-1], x1:g.xs[i], t0:times[i-1], t1:times[i], items:items });
    }

    s += resetSvg(g, times);
    s += timeAxisSvg(g);
    CHART.hits[id] = { bars:hits, key:'raw', unit:'', multi:true };

    var legend = '<div class="chart-legend">' + series.map(function(o){
      var tail = o.last==null ? '—' : (o.f.money ? '¥'+fmtMoney(o.last) : fmtInt(o.last)+' '+o.f.unit);
      return '<span><i style="background:'+o.f.col+'"></i>'+esc(o.f.name)+'<em>'+tail+'</em></span>';
    }).join('') + '<span class="dim">原始值 · 全托与 POP 分开</span></div>';

    return '<div class="chart-head">' +
        '<div class="t">单店总览<em>原始值 / 随时间</em></div>' +
        '<div class="chart-tabs">' +
          '<button data-cum="1" class="on">总览</button>' +
          '<button data-m="visitors">访客</button>' +
          (showPay === false ? '' : '<button data-m="pay">支付</button>') +
          '<button data-m="orders">订单</button>' +
        '</div>' +
      '</div>' + legend + chartBox(id, s);
  }

  /* 样式 C：柱压淡 + 平滑均值面积曲线 */
  function segIds(times){
    var out=[], cur=0;
    for(var i=0;i<times.length;i++){
      if(i>0 && dayKey(times[i])!==dayKey(times[i-1])) cur++;
      out.push(cur);
    }
    return out;
  }
  function medianBy(vals, segs, win){
    var half=Math.floor(win/2), out=[];
    for(var i=0;i<vals.length;i++){
      var buf=[];
      for(var j=i-half;j<=i+half;j++){
        if(j<0 || j>=vals.length || segs[j]!==segs[i]) continue;
        buf.push(vals[j]);
      }
      buf.sort(function(x,y){ return x-y; });
      out.push(buf.length ? buf[Math.floor(buf.length/2)] : vals[i]);
    }
    return out;
  }
  function smoothBy(vals, segs, win){
    var half=Math.floor(win/2), out=[];
    for(var i=0;i<vals.length;i++){
      var sum=0, n=0;
      for(var j=i-half;j<=i+half;j++){
        if(j<0 || j>=vals.length || segs[j]!==segs[i]) continue;
        sum+=vals[j]; n++;
      }
      out.push(n ? sum/n : vals[i]);
    }
    return out;
  }
  function smoothPath(pts, rd){
    if(!pts.length) return '';
    var d='M'+rd(pts[0].x)+','+rd(pts[0].y);
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
      if(p1.x===p2.x){ d+=' L'+rd(p2.x)+','+rd(p2.y); continue; }
      var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      var lo=Math.min(p1.y,p2.y), hi=Math.max(p1.y,p2.y);
      c1y=clamp(c1y,lo,hi); c2y=clamp(c2y,lo,hi);
      d+=' C'+rd(c1x)+','+rd(c1y)+' '+rd(c2x)+','+rd(c2y)+' '+rd(p2.x)+','+rd(p2.y);
    }
    return d;
  }

  /* 归零时刻：每天 15:00（美西零点）计数器归零，所有图都标出来 */
  function resetTimes(times){
    var out=[], i, m, t;
    for(i=1;i<times.length;i++){
      if(dayKey(times[i])===dayKey(times[i-1])) continue;
      var a=times[i-1], b=times[i];
      var k=Math.floor((a - 7*3600000)/86400000);
      for(m=k;m<=k+2;m++){
        t = m*86400000 + 7*3600000;
        if(t>a && t<=b){ out.push(t); break; }
      }
    }
    return out;
  }
  function resetSvg(g, times){
    var rs=resetTimes(times);
    if(!rs.length) return '';
    var s='', rd=g.rd;
    rs.forEach(function(t){
      var x=rd(g.Xof(t));
      if(x < g.L+3 || x > g.W-g.R-3) return;
      s+='<line x1="'+x+'" y1="'+g.T+'" x2="'+x+'" y2="'+(g.T+g.ih)+'" stroke="rgba(255,159,138,.4)" stroke-dasharray="3 3"/>';
      s+='<text x="'+(x+4)+'" y="'+(g.T+12)+'" font-size="8.5" fill="#ff9f8a">归零</text>';
    });
    return s;
  }

  function chartBlock(list, id){
    var showPay = hasPOP(list);
    if(showPay === false && CHART.metric === 'pay') CHART.metric = 'visitors';
    var key=CHART.metric, cum=CHART.cum, def=CMET[key];
    if(list.length > 1) return multiChart(list, id, key, def);
    if(cum) return overviewBlock(list, id);

    var pts = seriesFor(list, key);
    if(pts.length < 2) return '<div class="chart-empty">采样点太少，画不了</div>';
    var g = geom(pts.map(function(p){ return p.t; }));
    var L=g.L, T=g.T, ih=g.ih, W=g.W, R=g.R, rd=g.rd;

    var bars=null, top;
    if(cum){
      var peak=0; pts.forEach(function(p){ if(p.v>peak) peak=p.v; });
      top = niceMax(peak*1.06 || 1);
    }else{
      bars = barsFor(pts);
      var vals = bars.map(function(b){ return b.v; }).filter(function(v){ return v>0; }).sort(function(a,b){ return a-b; });
      var p90 = vals.length ? vals[Math.min(vals.length-1, Math.floor(vals.length*0.9))] : 1;
      var maxV = Math.max.apply(null, bars.map(function(b){ return b.v; })) || 0;
      if(maxV <= 0){
        var tip = (key === 'pay')
          ? '全托侧没有成交金额字段，只能按「全托余额涨了多少」推算；这家店这段时间余额没动'
          : '这家店这段时间没有采到增量';
        return headHTML('新增'+def.name, def.unit, key, cum, true, showPay) +
          '<div class="chart-empty">这段时间没有「新增'+def.name+'」的数据<br>'+
          '<span style="display:inline-block;margin-top:6px;font-size:10.5px;color:rgba(246,227,192,.34)">'+tip+'</span></div>';
      }
      top = niceMax(Math.min(maxV, p90*1.25 || maxV));
    }
    var Y=function(v){ return T+ih - v/top*ih; };

    var s = gridSvg(g,Y,top), hits=[];
    var base=T+ih, groups=[], segs, i;

    s+='<defs><linearGradient id="cg'+id+'" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0" stop-color="#f7d99a" stop-opacity=".30"/>'+
       '<stop offset="1" stop-color="#f7d99a" stop-opacity=".02"/></linearGradient>'+
       '<clipPath id="cp'+id+'"><rect x="'+L+'" y="'+T+'" width="'+g.iw+'" height="'+ih+'"/></clipPath></defs>';
    var mark=s.length;

    function areaOf(G){
      if(!G.length) return '';
      var ap=smoothPath(G, rd);
      return '<path d="'+ap+' L'+rd(G[G.length-1].x)+','+base+' L'+rd(G[0].x)+','+base+' Z" fill="url(#cg'+id+')"/>'+
             '<path d="'+ap+'" fill="none" stroke="#ffe0a8" stroke-width="1.7" stroke-linecap="round"/>';
    }

    if(cum){
      segs = segIds(pts.map(function(p){ return p.t; }));
      var sm = smoothBy(pts.map(function(p){ return p.v; }), segs, 5);
      for(i=0;i<pts.length;i++){
        if(!groups.length || segs[i]!==segs[i-1]) groups.push([]);
        groups[groups.length-1].push({ x:g.xs[i], y:Y(sm[i]) });
      }
      groups.forEach(function(G){ s+=areaOf(G); });
      for(var r1=1;r1<pts.length;r1++){
        if(dayKey(pts[r1].t)!==dayKey(pts[r1-1].t) && pts[r1].v < pts[r1-1].v){
          var rx=g.xs[r1];
          s+='<line x1="'+rd(rx)+'" y1="'+T+'" x2="'+rd(rx)+'" y2="'+(T+ih)+'" stroke="rgba(255,159,138,.45)" stroke-dasharray="3 3"/>';
          s+='<text x="'+rd(rx+4)+'" y="'+(T+12)+'" font-size="8.5" fill="#ff9f8a">归零</text>';
        }
      }
      for(var q=0;q<pts.length;q++){
        hits.push({ x0:g.xs[q], x1: q<pts.length-1 ? g.xs[q+1] : g.xs[q]+2,
                    t0:pts[q].t, t1: q<pts.length-1 ? pts[q+1].t : pts[q].t, v:pts[q].v, cum:true });
      }
    }else{
      bars.forEach(function(b,k){
        var x0=g.xs[k], x1=g.xs[k+1];
        var over=b.v>top;
        var h=Math.min(b.v,top)/top*ih;
        var w=Math.max(1, x1-x0-0.4);
        s+='<rect x="'+rd(x0)+'" y="'+rd(T+ih-h)+'" width="'+rd(w)+'" height="'+rd(h)+'" fill="#e8c07a" opacity=".26"/>';
        if(over) s+='<rect x="'+rd(x0)+'" y="'+T+'" width="'+rd(w)+'" height="3" fill="#3d0a0d" opacity=".45"/>';
        hits.push({ x0:x0, x1:x1, t0:b.t0, t1:b.t1, v:b.v });
      });

      segs = segIds(bars.map(function(b){ return b.t0; }));
      /* 均值曲线不分天：跨天也连成一条，不断 */
      segs = bars.map(function(){ return 0; });
      var bvals = bars.map(function(b){ return b.v; });
      var bsm = smoothBy(medianBy(bvals, segs, 3), segs, 5);
      for(i=0;i<bars.length;i++){
        if(!groups.length || segs[i]!==segs[i-1]) groups.push([]);
        groups[groups.length-1].push({ x:(g.xs[i]+g.xs[i+1])/2, y:Y(Math.min(bsm[i], top*0.985)) });
      }
      groups.forEach(function(G){ s+=areaOf(G); });
    }

    s = s.slice(0, mark) + '<g clip-path="url(#cp'+id+')">' + s.slice(mark) + '</g>';
    s += resetSvg(g, pts.map(function(p){ return p.t; }));
    s += timeAxisSvg(g);
    CHART.hits[id] = { bars:hits, key:key, cum:cum, unit:def.unit };
    return headHTML(cum ? (def.name+'走势') : ('新增'+def.name), def.unit, key, cum, true, showPay) + chartBox(id, s);
  }

  /* 总览：每店一条累计曲线 */
  function multiChart(list, id, key, def){
    var times = allTimes(list);
    if(times.length < 2) return '<div class="chart-empty">采样点太少，画不了</div>';

    var stores = list.map(function(st){
      var hs = (st.history||[]).map(function(r){ return { t:parseTs(r.ts).getTime(), v:def.raw(r) }; });
      hs.sort(function(a,b){ return a.t-b.t; });
      return { name:st.name, hs:hs };
    });

    stores.forEach(function(o){
      /* 累计 = 前面各天“当天计数最大值”之和 + 当天当前值 */
      var at=[], done=0, dayDk=null, dayMax=0;
      o.hs.forEach(function(h){
        var dk=dayKey(h.t);
        if(dayDk===null){ dayDk=dk; dayMax=h.v; }
        else if(dk!==dayDk){ done+=dayMax; dayDk=dk; dayMax=h.v; }
        else if(h.v>dayMax) dayMax=h.v;
        at.push({ t:h.t, cum:done+dayMax });
      });
      o.total = at.length ? at[at.length-1].cum : 0;
      o.cum = times.map(function(t){
        var best=null;
        for(var i=0;i<at.length;i++){ if(at[i].t<=t) best=at[i]; else break; }
        return best ? best.cum : null;
      });
    });

    var shown = stores.filter(function(o){ return o.total>0; })
      .sort(function(a,b){ return b.total-a.total; })
      .slice(0, MMAX);
    if(!shown.length) return '<div class="chart-empty">没有可比的数据</div>';
    shown.forEach(function(o,i){ o.color = MPAL[i % MPAL.length]; });

    var peak=0;
    shown.forEach(function(o){ o.cum.forEach(function(v){ if(v!=null && v>peak) peak=v; }); });
    var top = niceMax(peak*1.06 || 1);

    var g = geom(times), T=g.T, ih=g.ih, rd=g.rd;
    var Y=function(v){ return T+ih - v/top*ih; };
    var s = gridSvg(g,Y,top);

    var ptss = shown.map(function(o){
      var arr=[];
      for(var i=0;i<o.cum.length;i++){
        if(o.cum[i]==null) continue;
        arr.push({ x:g.xs[i], y:Y(o.cum[i]) });
      }
      return arr;
    });

    /* 第一名那条线下面铺一层淡面积，和单店图的样式 C 呼应 */
    if(ptss[0] && ptss[0].length>1){
      var gp=ptss[0], gid='mg'+id;
      s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
         '<stop offset="0" stop-color="'+shown[0].color+'" stop-opacity=".17"/>'+
         '<stop offset="1" stop-color="'+shown[0].color+'" stop-opacity="0"/></linearGradient></defs>';
      s+='<path d="'+smoothPath(gp, rd)+' L'+rd(gp[gp.length-1].x)+','+(T+ih)+' L'+rd(gp[0].x)+','+(T+ih)+' Z" fill="url(#'+gid+')"/>';
    }

    shown.forEach(function(o, ri){
      var arr=ptss[ri];
      if(arr.length<2) return;
      s+='<path d="'+smoothPath(arr, rd)+'" fill="none" stroke="'+o.color+'" stroke-width="'+(ri===0?2.1:1.5)+'" stroke-linejoin="round" stroke-linecap="round" opacity="'+(ri===0?1:.88)+'"/>';
    });

    var hits=[];
    for(var i=1;i<times.length;i++){
      var items=[];
      shown.forEach(function(o){
        var v=o.cum[i], p=o.cum[i-1];
        if(v!=null && v>0) items.push({ name:o.name, color:o.color, v:v, d:(p!=null ? v-p : 0) });
      });
      items.sort(function(a,b){ return b.v-a.v; });
      hits.push({ x0:g.xs[i-1], x1:g.xs[i], t0:times[i-1], t1:times[i], items:items });
    }

    s += timeAxisSvg(g);
    CHART.hits[id] = { bars:hits, key:key, unit:def.unit, multi:true };

    var rest = stores.length - shown.length;
    var legend = '<div class="chart-legend">' + shown.map(function(o){
      var tail = key === 'pay' ? ('¥'+fmtMoney(o.total)) : ('+'+fmtInt(o.total)+' '+def.unit);
      return '<span><i style="background:'+o.color +'"></i>' + esc(o.name) + '<em>' + tail + '</em></span>';
    }).join('') + (rest>0 ? '<span class="dim">其余 '+rest+' 家未显示</span>' : '') + '</div>';

    return headHTML('各店'+def.name+'累计', def.unit, key, false, false) + legend + chartBox(id, s);
  }

  function detailHTML(s){
    var st = storeStats([s]);
    var peak = null;
    st.bins.forEach(function(b){
      if((b.t1-b.t0) > GAP_CAP) return;
      var v = b.sol+b.est;
      if(!peak || v > peak.v) peak = { v:v, b:b };
    });
    var evs = events(s);
    return '<div class="detail">' +
      chartBlock([s], 'c_' + s.name.replace(/[^a-z0-9]/gi,'')) +
      '<div class="kv">' +
        (hasPOP([s]) ? '<div>今日支付<b>¥'+fmtMoney(num(s._pay) || num(s.popPay))+'</b></div>' : '') +
        '<div>新增访客<b>+'+fmtInt(st.total)+'</b></div>' +
        '<div>订单<b>'+fmtInt(s.popOrders)+'</b></div>' +
        '<div>转化<b>'+num(s.cvr).toFixed(2)+'%</b></div>' +
        '<div>纠纷<b class="'+((s.disputes+s.popDisputes)>0?'warn':'')+'">'+fmtInt(s.disputes+s.popDisputes)+'</b></div>' +
        (HAS_AD ? '<div>广告<b>'+adText(s)+'</b></div>' : '') +
      '</div>' +
      '<div class="note">平均 <b>'+Math.round(st.avg)+'</b> 人/小时 · 有效观测 <b>'+Math.round(st.effH)+'</b> 小时' +
        (peak?' · 峰值段 <b>'+hm(peak.b.t0)+'–'+hm(peak.b.t1)+'</b> '+fmtInt(peak.v)+' 人':'') +
        ' · 数据 '+hm(s.ts)+(lagMin(s)>=60?'（落后 '+lagMin(s)+' 分钟）':'')+'</div>' +
      (evs.length ? '<div class="ev">'+evs.map(function(e){
        return '<i class="'+e.kind+'"><em>'+hm(e.ts)+'</em><b>'+esc(e.txt)+'</b>'+esc(e.d)+'</i>';
      }).join('')+'</div>' : '') +
    '</div>';
  }

  function allRowHTML(agg){
    var s = '<div class="row all'+(allOpen?' open':'')+'" data-all="1">' +
      '<div class="rk">全部</div>' +
      '<div class="mid"><div class="nm">'+stores.length+' 家 · 合计新增</div><div class="bar"><i style="width:100%"></i></div></div>' +
      '<div class="pay">+'+fmtInt(agg.total)+' 人</div>' +
      '<div class="time">'+(allOpen?'收起':'展开')+'</div>' +
    '</div>';
    if(allOpen){
      var st = storeStats(stores);
      s += '<div class="detail">' +
        chartBlock(stores, 'c_all') +
        '<div class="note">合计 <b>+'+fmtInt(st.total)+'</b> 人 · 实测占 <b>'+agg.share+'%</b> · 平均 <b>'+Math.round(st.avg)+'</b> 人/小时 · 有效观测 <b>'+Math.round(st.effH)+'</b> 小时</div>' +
      '</div>';
    }
    return s;
  }

  function renderRows(){
    PREV_RANK = prevRankMap();
    var list = ranked();
    var maxScore = Math.max.apply(null, list.map(function(s){ return s._score||0; })) || 1;
    var agg = aggStats();
    var shown = boardExpanded ? list : list.slice(0, LIMIT);
    var html = allRowHTML(agg);
    shown.forEach(function(s,i){
      html += rowHTML(s, i, maxScore);
      if(expanded === s.name) html += detailHTML(s);
    });
    $('#rows').innerHTML = html;
    $('#more').innerHTML = list.length > LIMIT
      ? '<button data-more="1">'+(boardExpanded?'收起':'展开全部 '+list.length+' 家')+'</button>' : '';
  }

  function renderRisks(){
    var items = [];
    var dis = stores.filter(function(s){ return (s.disputes+s.popDisputes) > 0; });
    if(dis.length) items.push({ t:'纠纷', n:dis.length, hot:true, names:dis.map(function(s){ return s.name; }) });
    if(HAS_AD){
      var miss = stores.filter(function(s){ return !adKnown(s) && (s.popPay > 0 || s.sales > 0); });
      if(miss.length) items.push({ t:'广告未采集', n:miss.length, hot:true, names:miss.map(function(s){ return s.name; }) });
    }
    var lag = stores.filter(function(s){ return lagMin(s) >= 60; });
    if(lag.length) items.push({ t:'数据滞后', n:lag.length, names:lag.map(function(s){ return s.name; }) });
    var zero = stores.filter(function(s){ return s.balance === 0 && s.sales > 0; });
    if(zero.length) items.push({ t:'余额为 0', n:zero.length, names:zero.map(function(s){ return s.name; }) });

    $('#risks').innerHTML = items.map(function(it){
      return '<span class="'+(it.hot?'hot':'')+'" title="'+esc(it.names.join('、'))+'">'+esc(it.t)+'<b>'+it.n+' 家</b></span>';
    }).join('') || '<span>暂无异常</span>';
  }

  function renderTable(){
    if(!stores.length) return;
    var cols = ['店铺','更新','销量','访客','今日支付','余额','POP访客','订单','转化','纠纷','广告'];
    var html = '<tr>'+cols.map(function(c){ return '<th>'+c+'</th>'; }).join('')+'</tr>';
    ranked().forEach(function(s){
      html += '<tr>' +
        '<td>'+esc(s.name)+'</td><td>'+hm(s.ts)+'</td><td>'+fmtInt(s.sales)+'</td>' +
        '<td>'+fmtInt(s.visitors)+'</td><td>¥'+fmtMoney(num(s._pay) || num(s.popPay))+'</td>' +
        '<td>¥'+fmtMoney(s.balance)+'</td><td>'+fmtInt(s.popVisitors)+'</td>' +
        '<td>'+fmtInt(s.popOrders)+'</td><td>'+num(s.cvr).toFixed(2)+'%</td>' +
        '<td>'+fmtInt(s.disputes+s.popDisputes)+'</td><td>'+adText(s)+'</td>' +
      '</tr>';
    });
    $('#tbl').innerHTML = html;
    $('#meta').textContent = '数据源 shop_data_readonly.db · 生成于 '+((RAW && RAW.generated) || '—');
  }

  function render(){ computePay(stores); renderHead(); renderHero(); renderSorts(); renderRows(); renderRisks(); renderTable(); }

  /* ================= 交互 ================= */
  function bind(){
    $('#sorts').addEventListener('click', function(e){
      var b = e.target.closest('[data-k]');
      if(!b) return;
      activeMetric = b.dataset.k;
      expanded = '';
      renderSorts(); renderRows();
    });

    $('#rows').addEventListener('click', function(e){
      var all = e.target.closest('[data-all]');
      if(all){ allOpen = !allOpen; renderRows(); return; }
      var more = e.target.closest('[data-more]');
      if(more){ boardExpanded = !boardExpanded; renderRows(); return; }
      var row = e.target.closest('.row[data-name]');
      if(!row) return;
      expanded = (expanded === row.dataset.name) ? '' : row.dataset.name;
      renderRows();
    });

    $('#more').addEventListener('click', function(e){
      if(e.target.closest('[data-more]')){ boardExpanded = !boardExpanded; renderRows(); }
    });

    $('#rows').addEventListener('click', function(e){
      var m = e.target.closest('[data-m]');
      if(m){ CHART.metric = m.getAttribute('data-m'); CHART.cum = false; renderRows(); return; }
      var c = e.target.closest('[data-cum]');
      if(c){ CHART.cum = !CHART.cum; renderRows(); return; }
    });

    var CTIP = document.getElementById('ctip');
    $('#rows').addEventListener('mousemove', function(e){
      var box = e.target.closest ? e.target.closest('.chart, .mini') : null;
      if(!box){ CTIP.classList.remove('on'); return; }
      var rec = CHART.hits[box.getAttribute('data-chart')];
      if(!rec){ CTIP.classList.remove('on'); return; }
      var svg = box.querySelector('svg');
      if(!svg){ CTIP.classList.remove('on'); return; }
      var r = svg.getBoundingClientRect();
      var vx = (e.clientX - r.left) / r.width * (rec.w || 880);
      var hit = null;
      for(var i=0;i<rec.bars.length;i++){
        var b = rec.bars[i];
        if(vx >= b.x0 && vx < b.x1){ hit = b; break; }
      }
      if(!hit){ CTIP.classList.remove('on'); return; }
      var mins = Math.round((hit.t1-hit.t0)/60000);
      var dur = mins >= 60 ? Math.floor(mins/60)+' 小时 '+(mins%60)+' 分' : mins+' 分钟';
      var val = function(v){
        if(rec.money) return '¥'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        if(rec.key === 'pay') return '¥'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        return Math.round(v).toLocaleString('en-US')+' '+rec.unit;
      };
      if(hit && rec.plain){
        CTIP.innerHTML = '<b>'+esc(rec.name)+'</b><br><i>'+dm(hit.t0)+' '+hm(hit.t0)+'</i><br><i>数值</i> '+val(hit.v);
      }else if(hit.items){
        CTIP.innerHTML = '<b>'+dm(hit.t0)+' '+hm(hit.t0)+' → '+hm(hit.t1)+'</b>'+
          '<br><i>时长</i> '+dur+
          (hit.items.length ? hit.items.slice(0,8).map(function(it){
            return '<br><em style="color:'+it.color+'">●</em> '+esc(it.name)+' '+(it.txt||val(it.v));
          }).join('') : '<br><i>无数据</i>');
      }else{
        CTIP.innerHTML =
          '<b>'+dm(hit.t0)+' '+hm(hit.t0)+' → '+hm(hit.t1)+'</b>'+
          '<br><i>时长</i> '+dur+
          (hit.cum ? '<br><i>当前</i> '+val(hit.v)
                   : '<br><i>新增</i> '+val(hit.v)+'<br><i>速率</i> '+(mins>0?val(hit.v/(mins/60))+'/小时':'—'));
      }
      CTIP.classList.add('on');
      var x = e.clientX+16, y = e.clientY+16;
      if(x+200 > innerWidth) x = e.clientX-210;
      if(y+96 > innerHeight) y = e.clientY-104;
      CTIP.style.left = x+'px'; CTIP.style.top = y+'px';
    });
    $('#rows').addEventListener('mouseleave', function(){ CTIP.classList.remove('on'); });

    $('#csv').addEventListener('click', function(){
      var cols = ['店铺','更新时间','全托销量','浏览量','访客','纠纷','余额','POP纠纷','POP支付','今日支付','POP访客','POP订单','转化率'];
      var keys = ['name','ts','sales','views','visitors','disputes','balance','popDisputes','popPay','_pay','popVisitors','popOrders','cvr'];
      var lines = [cols.join(',')];
      ranked().forEach(function(s){ lines.push(keys.map(function(k){ var v = s[k]; return v == null ? '' : v; }).join(',')); });
      var blob = new Blob(['\ufeff'+lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '双十一龙虎榜-'+String((RAW && RAW.generated)||'').replace(/[: ]/g,'-')+'.csv';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    });
  }

  function boot(){
    if(!RAW || !stores.length){
      $('#range').textContent = '未加载到数据';
      $('#hero').innerHTML = '<div class="banner">没读到 shop_data.js。请确认它和本页面在同一文件夹，然后双击 刷新龙虎榜.bat。</div>';
      return;
    }
    render();
    bind();
    UPDATE_STR = computeUpdate();
    tickClocks();
    setInterval(tickClocks, 1000);
  }

  boot();
})();
</script>
</body>
</html>
