<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="11HTML — GitHub Pages 页面集合">
<title>11HTML</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M28 66V34h8v32zm18 0V34h8l14 22V34h8v32h-8L54 44v22z' fill='%2360a5fa'/></svg>">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#111827; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eff6ff; --shadow:0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1120; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8;
      --line:#1f2a44; --accent:#60a5fa; --accent-soft:#13203a; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; justify-content:center;
  }
  main{width:100%; max-width:880px; padding:56px 20px 40px}

  .hero{margin-bottom:36px}
  .badge{
    display:inline-block; font-size:12px; letter-spacing:.4px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);
    border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    padding:3px 10px; border-radius:999px; margin-bottom:14px;
  }
  h1{font-size:clamp(30px,6vw,44px); line-height:1.15; letter-spacing:-.02em; font-weight:800}
  .sub{color:var(--muted); font-size:15px; margin-top:10px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}

  a.card{
    display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 18px 16px; box-shadow:var(--shadow);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  a.card:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 20px rgba(16,24,40,.10)}
  a.card .name{font-weight:650; font-size:16px; display:flex; align-items:center; justify-content:space-between; gap:10px}
  a.card .name svg{flex:none; opacity:.45}
  a.card .desc{color:var(--muted); font-size:13px}
  a.card .path{color:var(--muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; opacity:.75}

  .empty{
    grid-column:1/-1;
    border:1.5px dashed var(--line); border-radius:14px; padding:26px 24px;
    color:var(--muted); font-size:14px; background:transparent; max-width:560px;
  }
  .empty b{color:var(--text); font-weight:650}
  .empty code{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px;
    background:var(--accent-soft); color:var(--accent); padding:1.5px 6px; border-radius:5px;
  }

  footer{
    margin-top:40px; padding-top:18px; border-top:1px solid var(--line);
    color:var(--muted); font-size:12.5px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--accent); border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <header class="hero">
    <span class="badge">GITHUB PAGES</span>
    <h1>11HTML</h1>
    <p class="sub">单文件页面集合 · 相对路径引用 · push 到 main 即发布</p>
  </header>

  <section id="pages" class="grid" aria-label="页面列表"></section>

  <footer>
    <span>仓库 <a href="https://github.com/Link-DMW/11HTML">Link-DMW/11HTML</a></span>
    <span>·</span>
    <span>发布分支 main，根目录</span>
  </footer>
</main>

<script>
  // 页面清单：加一行就等于给首页加一个入口。
  // href 用相对路径；子目录页面写 "demo/index.html"。
  const PAGES = [
    { name: "双十一龙虎榜", href: "d11/index.html", desc: "18 家店铺实时榜单 · 今日访客 / 今日支付 · 名次升降" },
  ];

  const icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
  const box = document.getElementById('pages');

  if (!PAGES.length) {
    box.innerHTML =
      '<div class="empty">' +
      '<b>还没有登记页面。</b><br>' +
      '把 .html 文件放在本目录（或子目录），然后在 <code>index.html</code> 顶部的 ' +
      '<code>PAGES</code> 数组里加一行，它就会出现在这里。' +
      '</div>';
  } else {
    for (const p of PAGES) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = p.href;
      a.innerHTML =
        '<span class="name">' + p.name + icon + '</span>' +
        (p.desc ? '<span class="desc">' + p.desc + '</span>' : '') +
        '<span class="path">' + p.href + '</span>';
      box.appendChild(a);
    }
  }
</script>
</body>
</html>
